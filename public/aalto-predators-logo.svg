<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="predator-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="redOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E36" />
      <stop offset="100%" stop-color="#D6181F" />
    </linearGradient>
    <linearGradient id="creamMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#EFE2C3" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="500" height="500" rx="40" fill="#0A0A0B" />

  <!-- Aalto Predators Helmet Silhouette Group -->
  <g transform="translate(0, 5)">
    <!-- 1. Outermost Red Contour Border -->
    <path d="M 120 70 
             Q 250 50 380 70 
             Q 435 95 440 190 
             Q 442 270 415 315 
             Q 400 340 405 365 
             Q 412 395 385 415 
             Q 355 425 315 400 
             Q 285 428 250 432 
             Q 215 428 185 400 
             Q 145 425 115 415 
             Q 88 395 95 365 
             Q 100 340 85 315 
             Q 58 270 60 190 
             Q 65 95 120 70 Z" 
          fill="#000000" 
          stroke="url(#redOutline)" 
          stroke-width="16" 
          stroke-linejoin="round" />

    <!-- 2. Inner Black Base -->
    <path d="M 125 78 
             Q 250 60 375 78 
             Q 425 100 430 190 
             Q 432 265 405 310 
             Q 390 335 395 360 
             Q 400 385 380 405 
             Q 350 415 315 390 
             Q 285 418 250 422 
             Q 215 418 185 390 
             Q 150 415 120 405 
             Q 100 385 105 360 
             Q 110 335 95 310 
             Q 68 265 70 190 
             Q 75 100 125 78 Z" 
          fill="#0B0C0E" />

    <!-- 3. Upper Forehead Cream Brow Bar -->
    <path d="M 120 100 
             Q 250 82 380 100 
             Q 410 115 415 180 
             L 385 180 
             Q 380 135 360 125 
             Q 250 110 140 125 
             Q 120 135 115 180 
             L 85 180 
             Q 90 115 120 100 Z" 
          fill="url(#creamMask)" 
          stroke="#000" 
          stroke-width="3" />

    <!-- Forehead Dome Inner Darkness -->
    <path d="M 138 126 
             Q 250 112 362 126 
             Q 382 136 385 178 
             L 115 178 
             Q 118 136 138 126 Z" 
          fill="#090A0C" />

    <!-- 4. Menacing Glowing Red Eyes -->
    <!-- Left Eye -->
    <path d="M 140 168 
             Q 185 175 220 220 
             Q 180 226 142 208 
             Q 132 192 140 168 Z" 
          fill="#FF2630" 
          filter="url(#predator-glow)" />
    <!-- Right Eye -->
    <path d="M 360 168 
             Q 315 175 280 220 
             Q 320 226 358 208 
             Q 368 192 360 168 Z" 
          fill="#FF2630" 
          filter="url(#predator-glow)" />

    <!-- 5. Main Facemask Cage (Cream / Ivory) -->
    <!-- Outer Facemask Frame -->
    <path d="M 98 220 
             L 402 220 
             Q 412 280 395 330 
             Q 375 375 325 385 
             Q 250 392 175 385 
             Q 125 375 105 330 
             Q 88 280 98 220 Z" 
          fill="none" 
          stroke="url(#creamMask)" 
          stroke-width="16" 
          stroke-linejoin="round" />

    <!-- Horizontal Crossbar (Mouth divider) -->
    <path d="M 112 282 Q 250 286 388 282" 
          stroke="url(#creamMask)" 
          stroke-width="18" 
          stroke-linecap="round" />

    <!-- Vertical Struts of Facemask -->
    <!-- Left Vertical Strut -->
    <path d="M 168 220 L 160 380" 
          stroke="url(#creamMask)" 
          stroke-width="14" />
    <!-- Right Vertical Strut -->
    <path d="M 332 220 L 340 380" 
          stroke="url(#creamMask)" 
          stroke-width="14" />
    <!-- Center-Left Strut -->
    <path d="M 210 282 L 202 384" 
          stroke="url(#creamMask)" 
          stroke-width="12" />
    <!-- Center-Right Strut -->
    <path d="M 290 282 L 298 384" 
          stroke="url(#creamMask)" 
          stroke-width="12" />

    <!-- Red Mouth Cavity Background -->
    <path d="M 125 232 
             Q 250 236 375 232 
             Q 385 280 375 320 
             Q 360 365 315 372 
             Q 250 378 185 372 
             Q 140 365 125 320 
             Q 115 280 125 232 Z" 
          fill="#FF2830" />

    <!-- 6. Predator Fangs / Teeth over the bars -->
    <!-- Top Central Fang -->
    <path d="M 235 220 L 265 220 L 255 310 Q 250 322 245 310 Z" 
          fill="#0A0B0D" 
          stroke="#FF2830" 
          stroke-width="3" />
    <!-- Top Left Fang -->
    <path d="M 185 220 L 210 220 L 202 305 Q 196 316 193 305 Z" 
          fill="#0A0B0D" 
          stroke="#FF2830" 
          stroke-width="3" />
    <!-- Top Right Fang -->
    <path d="M 290 220 L 315 220 L 307 305 Q 304 316 298 305 Z" 
          fill="#0A0B0D" 
          stroke="#FF2830" 
          stroke-width="3" />

    <!-- Side Jaw Diagonal Fangs (Extending outwards from lower mask) -->
    <!-- Left Cheek Fang -->
    <path d="M 132 305 L 148 318 L 105 385 Q 96 388 102 375 Z" 
          fill="#0A0B0D" 
          stroke="#FF2830" 
          stroke-width="4" />
    <!-- Right Cheek Fang -->
    <path d="M 368 305 L 352 318 L 395 385 Q 404 388 398 375 Z" 
          fill="#0A0B0D" 
          stroke="#FF2830" 
          stroke-width="4" />

    <!-- Bottom Chin Predator Teeth (Row of 4 serrated fangs) -->
    <g transform="translate(0, 395)">
      <!-- Tooth 1 -->
      <polygon points="222, -18 230, 8 226, -18" fill="#0A0B0D" stroke="#000" stroke-width="2" />
      <polygon points="220, -10 228, 16 235, -10" fill="#0A0B0D" />
      <!-- Tooth 2 -->
      <polygon points="236, -10 244, 18 251, -10" fill="#0A0B0D" />
      <!-- Tooth 3 -->
      <polygon points="249, -10 256, 18 264, -10" fill="#0A0B0D" />
      <!-- Tooth 4 -->
      <polygon points="265, -10 272, 16 280, -10" fill="#0A0B0D" />
    </g>

    <!-- Ear Hole Red Bulges on sides -->
    <circle cx="106" cy="368" r="14" fill="#0A0A0C" stroke="#FF2830" stroke-width="8" />
    <circle cx="394" cy="368" r="14" fill="#0A0A0C" stroke="#FF2830" stroke-width="8" />
  </g>
</svg>
